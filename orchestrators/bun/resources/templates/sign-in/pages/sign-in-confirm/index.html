<head>
    <title>Sign in</title>
</head>
<body>
    <main>
        <section class="sign-in">
            <h1>Sign in</h1>
            <p>Continue to sign in on this device.</p>
            <form method="post" action="/sign-in/confirm/">
                <input type="hidden" name="token" data-attr-value="token" />
                <input type="hidden" name="returnTo" data-attr-value="returnTo" />
                <button type="submit">Sign in</button>
            </form>
        </section>
    </main>
</body>
