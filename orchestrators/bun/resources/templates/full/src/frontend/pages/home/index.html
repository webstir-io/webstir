<head>
    <title>Home</title>
    <link rel="stylesheet" href="index.css" />
    <script type="module" src="index.js" async></script>
</head>
<body>
    <main>
        <section class="hero">
            <h1>Home</h1>
            <p class="message" role="status" data-each="flash as note" data-text="note.message"></p>
            <form class="greet" method="post" action="/greet">
                <label for="name">Your name</label>
                <input id="name" name="name" autocomplete="given-name" />
                <button type="submit">Say hello</button>
            </form>
        </section>
    </main>
</body>
