name: Release Package

on:
  push:
    tags:
      - release-set/**
  workflow_dispatch:
    inputs:
      group:
        description: Compatible package set to publish
        required: true
        type: choice
        options:
          - webstir
          - testing
      version:
        description: Exact synchronized package version
        required: true
        type: string

concurrency:
  group: webstir-package-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

env:
  BUN_VERSION: 1.4.1
  NODE_VERSION: 24.20.0

jobs:
  publish:
    name: Publish release set
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Resolve and validate release set
        id: release
        env:
          RELEASE_GROUP: ${{ inputs.group }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            bun tools/release-set.mjs --plan --tag "${GITHUB_REF_NAME}" --github-output "${GITHUB_OUTPUT}"
          else
            bun tools/release-set.mjs --plan --group "${RELEASE_GROUP}" --version "${RELEASE_VERSION}" --github-output "${GITHUB_OUTPUT}"
          fi

      - name: Verify release commit belongs to main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release commit ${GITHUB_SHA} is not on main." >&2
            exit 1
          fi

      - name: Verify exact commit passed main CI
        uses: actions/github-script@v8
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              event: 'push',
              status: 'success',
              per_page: 100,
            });
            const successfulMainRun = response.data.workflow_runs.find(
              (run) => run.head_branch === 'main' && run.conclusion === 'success',
            );
            if (!successfulMainRun) {
              core.setFailed(`Exact release commit ${context.sha} has no successful main CI run.`);
              return;
            }
            core.info(`Using CI proof ${successfulMainRun.html_url}`);

      - name: Set up trusted npm publishing
        run: npm install --global npm@11.5.1

      - name: Install workspace dependencies
        run: bun ci

      - name: Publish and verify release set
        env:
          RELEASE_GROUP: ${{ steps.release.outputs.release_group }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: >-
          bun tools/release-set.mjs
          --publish
          --group "${RELEASE_GROUP}"
          --version "${RELEASE_VERSION}"
          --commit "${GITHUB_SHA}"
