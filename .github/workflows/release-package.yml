name: Release Package

# Changesets' trusted-publishing workflow
# (https://changesets.dev/guide/automating#how-do-i-run-the-version-and-publish-commands).
# With changesets on main: keep the "Version packages" pull request up to date.
# With none, after that pull request merges: publish what npm does not have yet, and tag it.
# The file keeps its name because npm's trusted publisher for each package names it.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  BUN_VERSION: 1.4.1
  NODE_VERSION: 24.20.0

jobs:
  select-mode:
    # Only main publishes: a manual run from another branch must not skip the release pull request.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun ci
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      # A pull request opened with the workflow's own token runs no workflows, so the required CI
      # check would never report and the pull request could never merge.
      - name: Require the release pull request token
        env:
          TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the RELEASE_PR_TOKEN repository secret (see framework-packages.md) so CI runs on the Version packages pull request."
            exit 1
          fi
      - run: bun ci
      - id: version
        uses: changesets/action/version@v2
        with:
          script: bun run version-packages
          commit-message: Version packages
          pr-title: Version packages
          github-token: ${{ secrets.RELEASE_PR_TOKEN }}
      # Every change with a changeset ships: the release pull request merges itself once its
      # required checks pass, and its merge publishes.
      - name: Merge the release pull request once CI passes
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
      checks: read
    steps:
      # Publish only a commit main's required gate passed, however the release pull request merged.
      - name: Wait for the Required Gate on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            result=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=Required%20Gate" \
              --jq '[.check_runs[] | select(.status == "completed") | .conclusion] | first // "pending"')
            case "$result" in
              success) echo "Required Gate passed on ${GITHUB_SHA}"; exit 0 ;;
              pending) sleep 30 ;;
              *) echo "::error::Required Gate concluded ${result} on ${GITHUB_SHA}; not publishing."; exit 1 ;;
            esac
          done
          echo "::error::Required Gate did not finish on ${GITHUB_SHA} within an hour; not publishing."
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun ci
      - run: bun run build
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.5.1
      - run: bun ci
      - id: publish
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          push-git-tags: true
          create-github-releases: false
      - name: Confirm npm serves every published version
        if: steps.publish.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          for entry in $(echo "$PUBLISHED" | jq -r '.[] | "\(.name)@\(.version)"'); do
            for attempt in $(seq 1 60); do
              if [ "$(npm view "$entry" version 2>/dev/null)" = "${entry##*@}" ]; then
                echo "npm serves $entry"
                continue 2
              fi
              sleep 10
            done
            echo "npm does not serve $entry" >&2
            exit 1
          done
